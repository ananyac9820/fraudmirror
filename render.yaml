# Render blueprint: one free web service runs the React app, the REST API and Socket.io together.
# Needs a MongoDB connection string (for example a free MongoDB Atlas cluster) in MONGO_URI.
services:
  - type: web
    name: fraudmirror
    runtime: node
    plan: free
    buildCommand: npm install --prefix server --omit=dev && npm install --prefix client && npm run build --prefix client
    startCommand: npm run start:prod --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
